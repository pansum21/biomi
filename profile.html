<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7057ec"><title>BioMi profile</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#202738}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f2eeff,#e9faf7);display:flex;justify-content:center;padding:30px 14px}.page{width:min(100%,470px);display:flex;align-items:center;flex-direction:column}.avatar{width:94px;height:94px;border-radius:50%;background:linear-gradient(135deg,#7057ec,#20c9ba);border:3px solid #fff;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:850;box-shadow:0 8px 24px #26314824;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}.name{font-size:24px;letter-spacing:-.04em;margin:14px 0 4px;text-align:center}.bio{font-size:14px;text-align:center;color:#687486;line-height:1.55;max-width:390px;margin:0 0 8px;white-space:pre-wrap}.location{font-size:12px;color:#7b8798;margin-bottom:18px}.links{width:100%;display:flex;flex-direction:column;gap:10px}.link{min-height:59px;padding:10px 14px;border-radius:10px;display:flex;align-items:center;gap:12px;text-decoration:none;color:#263142;background:#ffffffed;border:1px solid #ffffffb5;box-shadow:0 5px 16px #26314816;transition:transform .18s}.link:hover{transform:translateY(-2px)}.icon{width:36px;height:36px;border-radius:9px;background:#f0edff;color:#7059df;display:grid;place-items:center;font-size:16px;font-weight:750;flex:none}.label{font-size:14px;font-weight:750;flex:1}.arrow{color:#8791a1}.footer{margin-top:24px;font-size:11px;color:#788395}.state{margin-top:54px;background:#fff;border:1px solid #e4e7ee;border-radius:14px;padding:22px;max-width:390px;text-align:center;color:#647084;line-height:1.55}.state a{color:#6551dd;font-weight:700}.hidden{display:none!important}body.dark{background:linear-gradient(145deg,#0c1220,#18253a);color:#f8fafc}body.dark .bio,body.dark .location,body.dark .footer{color:#b5c0d0}body.dark .link{background:#202a3b;color:#f8fafc;border-color:#ffffff20}body.dark .icon{background:#35334c;color:#c9bfff}body.dark .arrow{color:#bdc7d6}
</style></head><body><main class="page"><div class="avatar" id="avatar">B</div><h1 class="name" id="name">BioMi</h1><p class="bio" id="bio"></p><div class="location" id="location"></div><nav class="links" id="links" aria-label="Profile links"></nav><div class="footer">Made with ♥ on BioMi</div><div id="state" class="state hidden"></div></main>
<script type="module">
import {configReady,db} from './firebase-client.js';
import {doc,getDoc} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
const $=s=>document.querySelector(s),slug=new URLSearchParams(location.search).get('u')||'';
function showState(t){$('#state').textContent=t;$('#state').classList.remove('hidden')}
function safeUrl(raw){try{const u=new URL(raw);return ['http:','https:','mailto:','tel:'].includes(u.protocol)?u.href:''}catch{return ''}}
function render(data){document.title=(data.displayName||'BioMi profile')+' | BioMi';$('#name').textContent=data.displayName||'BioMi';const avatar=$('#avatar'),initials=(data.displayName||'B').split(/\s+/).filter(Boolean).map(x=>x[0]).join('').slice(0,2).toUpperCase();avatar.textContent=initials;try{const image=new URL(data.avatarUrl||'');if(image.protocol==='https:'){const img=document.createElement('img');img.src=image.href;img.alt='';img.referrerPolicy='no-referrer';img.onerror=()=>{img.remove();avatar.textContent=initials};avatar.replaceChildren(img)}}catch{}$('#bio').textContent=data.bio||'';$('#location').textContent=data.location||'';const t=data.theme||{};if(t.mode==='dark')document.body.classList.add('dark');if(t.mode!=='dark'&&/^#[0-9a-f]{6}$/i.test(t.a||'')&&/^#[0-9a-f]{6}$/i.test(t.b||''))document.body.style.background=`linear-gradient(${Number(t.angle)||135}deg,${t.a},${t.b})`;for(const item of Array.isArray(data.links)?data.links:[]){const href=safeUrl(item.url),title=String(item.title||'').trim();if(!href||!title)continue;const a=document.createElement('a');a.className='link';a.href=href;if(/^https?:/i.test(href)){a.target='_blank';a.rel='noopener noreferrer'}const icon=document.createElement('span');icon.className='icon';icon.textContent=String(item.icon||'↗').slice(0,3);const label=document.createElement('span');label.className='label';label.textContent=title;const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';a.append(icon,label,arrow);$('#links').append(a)}}
(async()=>{if(!/^[a-z0-9-]{3,30}$/.test(slug)){showState('This BioMi username is not valid.');return}if(!configReady){showState('This profile is not connected yet. Firebase setup is required to load published profiles.');return}try{const snap=await getDoc(doc(db,'profiles',slug));if(!snap.exists()||!snap.data().published){showState('This BioMi page is private or has not been published yet.');return}render(snap.data())}catch(e){showState(e.code==='permission-denied'?'This BioMi page is private or unavailable.':'Could not load this profile right now.')}})();
</script></body></html>
