<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7057ec"><title>BioMi profile</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#202738}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f2eeff,#e9faf7);display:flex;justify-content:center;padding:30px 14px}.page{width:min(100%,470px);display:flex;align-items:center;flex-direction:column}.avatar{width:94px;height:94px;border-radius:50%;background:linear-gradient(135deg,#7057ec,#20c9ba);border:3px solid #fff;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:850;box-shadow:0 8px 24px #26314824;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}.name{font-size:24px;letter-spacing:-.04em;margin:14px 0 4px;text-align:center}.bio{font-size:14px;text-align:center;color:#687486;line-height:1.55;max-width:390px;margin:0 0 8px;white-space:pre-wrap}.location{font-size:12px;color:#7b8798;margin-bottom:18px}.links{width:100%;display:flex;flex-direction:column;gap:10px}.link{min-height:59px;padding:10px 14px;border-radius:var(--link-radius,9px);display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--link-color,#263142);background:var(--link-bg,#ffffffed);border:1px solid var(--link-border,#ffffffb5);box-shadow:var(--link-shadow,0 5px 16px #26314816);transition:transform .18s}.link:hover{transform:translateY(-2px)}.icon{width:36px;height:36px;border-radius:9px;background:var(--icon-bg,#f0edff);color:var(--icon-color,#7059df);display:grid;place-items:center;font-size:16px;font-weight:750;flex:none}.label{font-size:14px;font-weight:750;flex:1}.arrow{color:#8791a1}.footer{margin-top:24px;font-size:11px;color:#788395}.state{margin-top:54px;background:#fff;border:1px solid #e4e7ee;border-radius:14px;padding:22px;max-width:390px;text-align:center;color:#647084;line-height:1.55}.state a{color:#6551dd;font-weight:700}.hidden{display:none!important}body.dark{background:linear-gradient(145deg,#0c1220,#18253a);color:#f8fafc}body.dark .bio,body.dark .location,body.dark .footer{color:#b5c0d0}body.dark .arrow{color:#bdc7d6}

.link:focus-visible{outline:3px solid #111827;outline-offset:3px}
body[data-morphism=glass] .link{background:rgba(255,255,255,.78)!important;color:#172033!important;border:1px solid #fff!important;backdrop-filter:blur(14px);box-shadow:0 12px 28px #12213c22!important}
body[data-morphism=glass] .icon{background:#fff!important;color:#4b3bad!important}
body[data-morphism=water]{background:linear-gradient(145deg,#e8faff,#cceefa,#e4f4ff)!important;color:#15364d}
body[data-morphism=water] .link{background:linear-gradient(145deg,#f9feff,#cfeefa)!important;color:#12364b!important;border:1px solid #fff!important;box-shadow:inset 0 2px 3px #fff,0 6px 14px #3a789b35!important}
body[data-morphism=water] .icon{background:linear-gradient(145deg,#fff,#d6f0fa)!important;color:#14678a!important;box-shadow:inset 0 1px 2px #fff,0 2px 4px #527f9133}
body[data-morphism=neumorphism]{background:#e8ebf2!important;color:#283143}
body[data-morphism=neumorphism] .avatar{background:#e8ebf2;border:0;color:#4d59a2;box-shadow:8px 8px 18px #c4c8d1,-8px -8px 18px #fff}
body[data-morphism=neumorphism] .link{background:#e8ebf2!important;color:#283143!important;border:1px solid #e8ebf2!important;box-shadow:7px 7px 15px #c4c8d1,-7px -7px 15px #fff!important}
body[data-morphism=neumorphism] .icon{background:#e8ebf2!important;color:#4d50a0!important;box-shadow:inset 3px 3px 6px #c4c8d1,inset -3px -3px 6px #fff}
body.dark[data-morphism=neumorphism]{background:#202838!important;color:#f8fafc}
body.dark[data-morphism=neumorphism] .link,body.dark[data-morphism=neumorphism] .avatar{background:#202838!important;color:#f8fafc!important;border-color:#202838!important;box-shadow:6px 6px 13px #141a24,-6px -6px 13px #2c374c!important}
body[data-morphism=clay]{background:linear-gradient(145deg,#f1ecff,#e7f8f5)!important}
body[data-morphism=clay] .avatar{border:3px solid #fff;box-shadow:0 7px 0 #c8bdeb,0 13px 22px #453d7228}
body[data-morphism=clay] .link{background:linear-gradient(145deg,#fff,#eee9ff)!important;color:#30244e!important;border:1px solid #fff!important;box-shadow:inset 0 2px 0 #fff,0 5px 0 #cfc6ee,0 10px 18px #453d7220!important}
body[data-morphism=clay] .icon{background:#e3dcff!important;color:#43318a!important;box-shadow:inset 2px 2px 4px #fff,0 2px 0 #c4b8f0}
body[data-morphism=aurora]{background:radial-gradient(ellipse at 12% 12%,#9bf1de 0,transparent 42%),radial-gradient(ellipse at 88% 35%,#d6a8ff 0,transparent 44%),linear-gradient(150deg,#f8f5ff,#e7faf5)!important}
body[data-morphism=aurora] .avatar{box-shadow:0 0 0 4px #fff,0 0 30px #a883ef70}
body[data-morphism=aurora] .link{background:linear-gradient(110deg,#ffffffed,#f4efffef,#ecfffbef)!important;color:#252342!important;border:1px solid #fff!important;box-shadow:0 8px 25px #8171ba29!important}
body[data-morphism=aurora] .icon{background:linear-gradient(135deg,#e7ddff,#c8f4eb)!important;color:#493e8f!important}
body[data-morphism=holo]{background:linear-gradient(145deg,#fef5d7,#e8fffb 42%,#eeeaff 70%,#fff0f5)!important}
body[data-morphism=holo] .link{background:linear-gradient(white,white) padding-box,linear-gradient(110deg,#e2b742,#65c9bf,#9882ea,#ec8ab0) border-box!important;color:#283042!important;border:2px solid transparent!important;box-shadow:0 7px 18px #4a48611d!important}
body[data-morphism=holo] .icon{background:linear-gradient(135deg,#ffeaa8,#c6f3eb,#dbd4ff)!important;color:#384050!important}
body[data-morphism=skeuo]{background:linear-gradient(145deg,#edf0f6,#dfe3eb)!important}
body[data-morphism=skeuo] .avatar{border:3px solid #fff;box-shadow:inset 0 1px 1px #fff,0 4px 0 #b6bdca,0 8px 18px #28324828}
body[data-morphism=skeuo] .link{background:linear-gradient(#fff,#e3e6ed)!important;color:#263142!important;border:1px solid #c7ccd6!important;box-shadow:inset 0 1px 0 #fff,0 3px 0 #c0c5d0,0 7px 13px #252f431e!important}
body[data-morphism=skeuo] .icon{background:linear-gradient(#fff,#e1e5ee)!important;color:#4a4e8d!important;border:1px solid #c9ced8}
.link:hover{transform:translateY(-2px)}
@media(prefers-reduced-motion:reduce){.link{transition:none}.link:hover{transform:none}}
</style></head><body><main class="page"><div class="avatar" id="avatar">B</div><h1 class="name" id="name">BioMi</h1><p class="bio" id="bio"></p><div class="location" id="location"></div><nav class="links" id="links" aria-label="Profile links"></nav><div class="footer">Made with ♥ on BioMi</div><div id="state" class="state hidden"></div></main>
<script type="module">
import {configReady,db} from './firebase-client.js';
import {doc,getDoc} from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';
const $=s=>document.querySelector(s),slug=new URLSearchParams(location.search).get('u')||'';
function showState(t){$('#state').textContent=t;$('#state').classList.remove('hidden')}
function safeUrl(raw){try{const u=new URL(raw);return ['http:','https:','mailto:','tel:'].includes(u.protocol)?u.href:''}catch{return ''}}
function render(data){document.title=(data.displayName||'BioMi profile')+' | BioMi';$('#name').textContent=data.displayName||'BioMi';const avatar=$('#avatar'),initials=(data.displayName||'B').split(/\s+/).filter(Boolean).map(x=>x[0]).join('').slice(0,2).toUpperCase();avatar.textContent=initials;try{const image=new URL(data.avatarUrl||'');if(image.protocol==='https:'){const img=document.createElement('img');img.src=image.href;img.alt='';img.referrerPolicy='no-referrer';img.onerror=()=>{img.remove();avatar.textContent=initials};avatar.replaceChildren(img)}}catch{}$('#bio').textContent=data.bio||'';$('#location').textContent=data.location||'';const t=data.theme||{},dark=t.mode==='dark',style=['solid','glass','outline'].includes(t.style)?t.style:'solid',morphism=['glass','water','neumorphism','clay','aurora','holo','skeuo'].includes(t.morphism)?t.morphism:'glass',radius=['3px','9px','16px'].includes(t.radius)?t.radius:'9px';document.body.classList.toggle('dark',dark);document.body.dataset.morphism=morphism;document.body.style.setProperty('--link-radius',radius);if(/^#[0-9a-f]{6}$/i.test(t.a||'')&&/^#[0-9a-f]{6}$/i.test(t.b||'')){const angle=Number.isInteger(Number(t.angle))?Number(t.angle):135;document.body.style.background=dark?'linear-gradient(145deg,#0c1220,#18253a)':`linear-gradient(${angle}deg,${t.a},${t.b})`;}const palette=style==='solid'?(dark?{bg:'#202a3b',color:'#f8fafc',border:'#ffffff20',shadow:'0 5px 16px #00000020',iconBg:'#35334c',iconColor:'#c9bfff'}:{bg:'#ffffffed',color:'#263142',border:'#ffffffb5',shadow:'0 5px 16px #26314816',iconBg:'#f0edff',iconColor:'#7059df'}):style==='glass'?{bg:'#ffffff29',color:'#fff',border:'#ffffff75',shadow:'none',iconBg:'#ffffff33',iconColor:'#fff'}:{bg:'transparent',color:'#fff',border:'#ffffffa8',shadow:'none',iconBg:'#ffffff22',iconColor:'#fff'};document.body.style.setProperty('--link-bg',palette.bg);document.body.style.setProperty('--link-color',palette.color);document.body.style.setProperty('--link-border',palette.border);document.body.style.setProperty('--link-shadow',palette.shadow);document.body.style.setProperty('--icon-bg',palette.iconBg);document.body.style.setProperty('--icon-color',palette.iconColor);for(const item of Array.isArray(data.links)?data.links:[]){const href=safeUrl(item.url),title=String(item.title||'').trim();if(!href||!title)continue;const a=document.createElement('a');a.className='link';a.href=href;if(/^https?:/i.test(href)){a.target='_blank';a.rel='noopener noreferrer'}const icon=document.createElement('span');icon.className='icon';icon.textContent=String(item.icon||'↗').slice(0,3);const label=document.createElement('span');label.className='label';label.textContent=title;const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';a.append(icon,label,arrow);$('#links').append(a)}}
(async()=>{if(!/^[a-z0-9-]{3,30}$/.test(slug)){showState('This BioMi username is not valid.');return}if(!configReady){showState('This profile is not connected yet. Firebase setup is required to load published profiles.');return}try{const snap=await getDoc(doc(db,'profiles',slug));if(!snap.exists()||!snap.data().published){showState('This BioMi page is private or has not been published yet.');return}render(snap.data())}catch(e){showState(e.code==='permission-denied'?'This BioMi page is private or unavailable.':'Could not load this profile right now.')}})();
</script></body></html>
