<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f4f7"><title>BioMi profile</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1e293b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;padding:34px 14px;background:linear-gradient(135deg,#f4f1ff,#ecfbf8);background-attachment:fixed}.page{width:min(100%,470px);display:flex;flex-direction:column;align-items:center}.top{width:100%;display:flex;justify-content:flex-end;margin-bottom:20px}.share{border:1px solid #dfe3eb;background:#ffffffc9;color:#273142;padding:9px 13px;border-radius:9px;font-size:12px;font-weight:700}.avatar{width:92px;height:92px;border-radius:50%;border:3px solid #ffffffdb;display:grid;place-items:center;background:linear-gradient(135deg,#7057ec,#20c9ba);color:white;font-size:27px;font-weight:800;box-shadow:0 8px 25px #25304b27}.name{font-size:23px;font-weight:800;letter-spacing:-.04em;margin:14px 0 4px;text-align:center;color:var(--ink,#202734)}.bio{font-size:14px;text-align:center;color:var(--muted,#687486);line-height:1.55;max-width:390px;margin:0 0 9px;white-space:pre-wrap}.location{font-size:12px;color:var(--muted,#7b8798);margin-bottom:18px}.links{width:100%;display:flex;flex-direction:column;gap:11px}.link{min-height:60px;padding:10px 14px;border-radius:9px;display:flex;align-items:center;gap:12px;text-decoration:none;color:#263142;background:#ffffffed;border:1px solid #ffffffa8;box-shadow:0 5px 16px #26314815;transition:transform .18s,box-shadow .18s}.link:hover{transform:translateY(-2px);box-shadow:0 9px 22px #26314822}.icon{width:36px;height:36px;border-radius:9px;background:#f0edff;color:#7059df;display:grid;place-items:center;font-size:16px;font-weight:700;flex:none}.label{font-size:14px;font-weight:700;flex:1}.arrow{color:#8791a1;font-size:16px}.footer{margin-top:24px;font-size:11px;color:#788395}.empty{margin-top:65px;background:#fff;padding:24px;border:1px solid #e4e7ee;border-radius:14px;text-align:center;color:#647084}.empty a{color:#6551dd}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,18px);opacity:0;background:#202735;color:white;padding:10px 14px;border-radius:9px;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
body.dark{background:linear-gradient(145deg,#0c1220,#18253a);--ink:#f8fafc;--muted:#afbbce}body.dark .share{background:#202a3b;color:#f8fafc;border-color:#354157}body.dark .link{background:#202a3b;color:#f8fafc;border-color:#ffffff22}body.dark .icon{background:#32344e;color:#c5baff}body.dark .arrow{color:#bdc7d6}body.glass .link{background:#ffffff28;border-color:#ffffff8a;color:#fff;box-shadow:none;backdrop-filter:blur(14px)}body.outline .link{background:transparent;border:1px solid #fff;color:var(--ink,#202734);box-shadow:none}body.dark.glass .link{color:#fff}body.dark.outline .link{color:#fff;border-color:#aab8d4}.link{border-radius:var(--radius,9px)}@media(max-width:480px){body{padding-top:22px}.name{font-size:21px}.link{min-height:56px}}
</style></head>
<body><main class="page" id="page"><div class="top"><button class="share" id="share">↗ &nbsp;Share</button></div><div class="empty" id="empty">This BioMi profile link is incomplete.<br><a href="biomi-manage.html">Create a profile</a> to get a share link.</div></main><div class="toast" id="toast"></div>
<script>
(()=>{
function decode(token){const b=token.replace(/-/g,'+').replace(/_/g,'/');const padded=b+'='.repeat((4-b.length%4)%4);const bytes=Uint8Array.from(atob(padded),c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}
function safeLink(raw){return /^(https?:\/\/|mailto:|tel:)/i.test(String(raw||'').trim())?String(raw).trim():''}
let data=null;try{const token=new URLSearchParams(location.hash.slice(1)).get('profile');if(token)data=decode(token)}catch{}
const $=s=>document.querySelector(s), page=$('#page');
if(data&&typeof data==='object'){
  $('#empty').remove();const t=data.theme||{};if(t.mode==='dark')document.body.classList.add('dark');if(t.style==='glass'||t.style==='outline')document.body.classList.add(t.style);if(['3px','9px','16px'].includes(t.radius))document.body.style.setProperty('--radius',t.radius);
  if(/^#[0-9a-f]{6}$/i.test(t.a||'')&&/^#[0-9a-f]{6}$/i.test(t.b||'')){document.body.style.background='linear-gradient('+(Number(t.angle)||135)+'deg,'+t.a+','+t.b+')';if(t.mode==='dark')document.body.style.background='linear-gradient('+(Number(t.angle)||135)+'deg,#0c1220,#18253a)'}
  document.title=(data.name||'BioMi')+' | BioMi';const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=String(data.name||'').trim().split(/\s+/).filter(Boolean).map(x=>x[0]).join('').slice(0,2).toUpperCase()||'B';page.append(avatar);
  const name=document.createElement('h1');name.className='name';name.textContent=data.name||'Your name';page.append(name);
  if(data.bio){const bio=document.createElement('p');bio.className='bio';bio.textContent=data.bio;page.append(bio)}if(data.location){const loc=document.createElement('div');loc.className='location';loc.textContent=data.location;page.append(loc)}
  const links=document.createElement('nav');links.className='links';links.setAttribute('aria-label','Profile links');(Array.isArray(data.links)?data.links:[]).forEach(item=>{const href=safeLink(item.url);const title=String(item.title||'').trim();if(!href||!title)return;const a=document.createElement('a');a.className='link';a.href=href;if(/^https?:\/\//i.test(href)){a.target='_blank';a.rel='noopener noreferrer'}const icon=document.createElement('span');icon.className='icon';icon.textContent=String(item.icon||'↗').slice(0,4);const label=document.createElement('span');label.className='label';label.textContent=title;const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';a.append(icon,label,arrow);links.append(a)});page.append(links);
  const footer=document.createElement('div');footer.className='footer';footer.textContent='Made with ♥ on BioMi';page.append(footer)
}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2000)}
$('#share').onclick=()=>{const url=location.href;if(navigator.share)navigator.share({title:document.title,url}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('Profile link copied')).catch(()=>toast('Copy the page URL to share'));else toast('Copy the page URL to share')};
})();
</script></body></html>
